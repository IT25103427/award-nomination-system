# ==========================================================
# SERVER CONFIGURATION
# ==========================================================
server.port=8080

# ==========================================================
# DATABASE CONFIGURATION: Connected to MySQL (localhost:3306)
# ==========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/award_system_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==========================================================
# FILE UPLOAD SETTINGS
# ==========================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
app.upload.dir=uploads/nominations

# ==========================================================
# JWT AUTHENTICATION CONFIGURATION
# ==========================================================
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# ==========================================================
# SWAGGER / OPENAPI DOCUMENTATION
# Access via: http://localhost:8080/swagger-ui.html
# ==========================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
