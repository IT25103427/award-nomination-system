# ==========================================================
# MYSQL CONFIGURATION PROFILE (activate with: --spring.profiles.active=mysql)
# Run database/schema.sql and database/seed_data.sql in MySQL Workbench
# ==========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/award_system_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
